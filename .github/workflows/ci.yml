name: CI Lint

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: |
          if [ -f "ruff.toml" ]; then
            ruff . --config .ruff.toml
          elif [ -f "pyproject.toml" ]; then
            ruff . --config pyproject.toml
          else
            echo "No Ruff configuration file found!" && exit 1
